name: Build strategy site

on:
  schedule:
    - cron: "0 12 * * 1-5"
  workflow_dispatch:
    inputs:
      amv_close:
        description: "今日 0AMV 收盘价（可选；不填则沿用仓库内上一有效日）"
        required: false
        type: string
      amv_date:
        description: "0AMV 日期 YYYY-MM-DD（可选，默认北京今天）"
        required: false
        type: string
  issues:
    types: [opened]
  push:
    branches: [main]
    paths:
      - "site/index.html"
      - "site/app.js"
      - "site/styles.css"
      - "src/ai_invest_advisor/**"
      - "scripts/build_strategy_site.py"
      - ".github/workflows/build-strategy-site.yml"

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'issues' || (startsWith(github.event.issue.title, '0AMV') && github.event.issue.user.login == github.repository_owner)
    runs-on: ubuntu-latest
    env:
      AMV_CLOSE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.amv_close || '' }}
      AMV_DATE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.amv_date || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: python -m pip install -e .

      - name: Parse 0AMV from site issue
        if: github.event_name == 'issues'
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          python - <<'PY'
          import json, os
          from ai_invest_advisor.amv_cloud import parse_amv_issue
          parsed = parse_amv_issue(os.environ.get("ISSUE_TITLE", ""), os.environ.get("ISSUE_BODY") or "")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as fh:
              fh.write(f"AMV_CLOSE={parsed['close']}\n")
              fh.write(f"AMV_DATE={parsed['date']}\n")
          print(json.dumps(parsed, ensure_ascii=False))
          PY

      - name: Build site
        run: |
          set -euo pipefail
          ARGS=()
          if [ -n "${AMV_CLOSE:-}" ]; then
            ARGS+=(--amv-close "$AMV_CLOSE")
          fi
          if [ -n "${AMV_DATE:-}" ]; then
            ARGS+=(--amv-date "$AMV_DATE")
          fi
          python scripts/build_strategy_site.py "${ARGS[@]}"

      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/amv site/data data/site data/backtests/amv_index_gate data/backtests/cyb_emotion_kdj
          if git diff --cached --quiet; then
            echo "No data changes to commit"
          else
            git commit -m "chore: refresh strategy site data"
            git push
          fi

      - name: Close 0AMV issue
        if: github.event_name == 'issues' && success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --body "已写入 0AMV ${AMV_DATE} 收盘 ${AMV_CLOSE}。站点正在更新，约 1–2 分钟后刷新网页即可。研究辅助，不是投资建议。"
          gh issue close "${{ github.event.issue.number }}" --reason completed

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
